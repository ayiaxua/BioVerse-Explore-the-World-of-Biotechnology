<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MicroVerse 1 | Ensiklopedia Sel BioVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #111827;
      --bg-card: rgba(15, 25, 45, 0.85);
      --text-primary: #e2e8f0;
      --text-secondary: #b0bec5;
      --accent: #00E5A0;
      --accent-glow: 0 0 25px rgba(0, 229, 160, 0.4);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Poppins', sans-serif;
      --card-hover: rgba(0, 229, 160, 0.08);
      --panel-bg: rgba(10, 20, 35, 0.98);
      --sidebar-bg: rgba(12, 22, 38, 0.9);
      --highlight-yellow: rgba(255, 215, 0, 0.15);
      --info-box-bg: rgba(0, 229, 160, 0.06);
    }
    .light-theme {
      --bg-primary: #f0f4f8;
      --bg-secondary: #e2e8f0;
      --bg-card: rgba(255, 255, 255, 0.92);
      --text-primary: #1a202c;
      --text-secondary: #4a5568;
      --accent-glow: 0 0 25px rgba(0, 180, 130, 0.3);
      --border-subtle: rgba(0, 0, 0, 0.1);
      --card-hover: rgba(0, 229, 160, 0.1);
      --panel-bg: rgba(255, 255, 255, 0.98);
      --sidebar-bg: rgba(240, 244, 248, 0.95);
      --highlight-yellow: rgba(255, 215, 0, 0.2);
      --info-box-bg: rgba(0, 180, 130, 0.06);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
      overflow-x: hidden;
    }
    .micro-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      background: var(--bg-card);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      font-family: var(--font-body);
      font-size: 0.85rem;
      transition: 0.3s;
    }
    .back-btn:hover {
      background: var(--accent);
      color: #0a1a2a;
    }
    .library-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .item-count {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 25px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      transition: 0.3s;
    }
    .theme-toggle:hover {
      border-color: var(--accent);
    }
    .main-layout {
      display: flex;
      min-height: calc(100vh - 70px);
    }
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-subtle);
      padding: 20px 16px;
      overflow-y: auto;
      position: sticky;
      top: 70px;
      height: calc(100vh - 70px);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar h4 {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .category-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.8rem;
      text-align: left;
      transition: 0.3s;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-btn:hover,
    .category-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--card-hover);
    }
    .category-count {
      background: rgba(0, 229, 160, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
    }
    .content-area {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
    }
    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 35px;
      border: 2px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: var(--accent-glow);
    }
    .search-btn {
      background: var(--accent);
      border: none;
      color: #0a1a2a;
      padding: 14px 22px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-body);
      transition: 0.3s;
    }
    .search-btn:hover {
      box-shadow: var(--accent-glow);
    }
    .celly-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      margin-bottom: 16px;
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid var(--accent);
      backdrop-filter: blur(10px);
    }
    .celly-avatar {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
    }
    .celly-message {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .celly-message span {
      color: var(--accent);
      font-weight: 700;
    }
    .library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .organelle-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .organelle-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: var(--accent-glow);
      background: var(--card-hover);
    }
    .card-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .card-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .card-function {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
      flex-grow: 1;
    }
    .card-actions {
      display: flex;
      gap: 8px;
    }
    .btn-detail {
      background: var(--accent);
      color: #0a1a2a;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.75rem;
      transition: 0.3s;
    }
    .btn-detail:hover {
      box-shadow: var(--accent-glow);
    }
    .btn-3d {
      background: transparent;
      border: 2px solid #FF6B6B;
      color: #FF6B6B;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.75rem;
      transition: 0.3s;
    }
    .btn-3d:hover {
      background: #FF6B6B;
      color: white;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .page-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.3s;
    }
    .page-btn:hover,
    .page-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--card-hover);
    }
    .detail-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      display: none;
      justify-content: flex-end;
    }
    .detail-overlay.active {
      display: flex;
    }
    .detail-panel {
      width: 100%;
      max-width: 650px;
      height: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(25px);
      border-left: 2px solid var(--accent);
      padding: 28px 24px;
      overflow-y: auto;
      animation: slideIn 0.35s ease-out;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    @keyframes slideIn {
      from {
        transform: translateX(100%);
      }
      to {
        transform: translateX(0);
      }
    }
    .detail-close {
      align-self: flex-end;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 700;
      font-family: var(--font-body);
      transition: 0.3s;
    }
    .detail-close:hover {
      background: var(--accent);
      color: #0a1a2a;
    }
    .detail-icon-large {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      align-self: center;
    }
    .detail-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      color: var(--accent);
    }
    .detail-category {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .detail-section {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border-subtle);
      line-height: 1.8;
    }
    .detail-section h4 {
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 10px;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 6px;
    }
    .detail-section p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.9;
      text-align: justify;
    }
    .detail-section ul {
      padding-left: 18px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.9;
    }
    .detail-section ul li {
      margin-bottom: 6px;
    }
    .info-box {
      background: var(--info-box-bg);
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .highlight-box {
      background: var(--highlight-yellow);
      border-left: 3px solid #FFD700;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .model-3d-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .model-3d-overlay.active {
      display: flex;
    }
    .model-3d-container {
      width: 90%;
      max-width: 850px;
      height: 80vh;
      background: var(--bg-secondary);
      border-radius: 22px;
      border: 2px solid var(--accent);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0, 229, 160, 0.5);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    .model-3d-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--accent);
    }
    .model-3d-title {
      font-family: var(--font-display);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.95rem;
    }
    .model-3d-close {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.3s;
    }
    .model-3d-close:hover {
      background: var(--accent);
      color: #0a1a2a;
    }
    .model-3d-iframe {
      flex: 1;
      width: 100%;
      border: none;
    }
    .model-3d-fallback {
      text-align: center;
      padding: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .model-3d-fallback a {
      color: #4285F4;
      font-weight: 600;
    }
    @media (max-width: 768px) {
      .main-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        top: 0;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
        padding: 12px;
      }
      .category-btn {
        font-size: 0.7rem;
        padding: 8px 10px;
      }
      .library-grid {
        grid-template-columns: 1fr;
      }
      .detail-panel {
        max-width: 100%;
      }
    }

.external-loading { text-align:center; padding:20px; color:var(--accent); }

  </style>
</head>

  <script>
    (function() {
      const categories = [
        { id: 'organel-utama', name: 'Organel Sel Hewan', icon: '🔬', color: '#9b59b6' },
        { id: 'organel-tambahan', name: 'Organel Tambahan', icon: '🧪', color: '#e74c3c' },
        { id: 'membran-transport', name: 'Membran & Transport', icon: '🔄', color: '#3498db' },
        { id: 'molekul', name: 'Molekul Penting', icon: '⚛️', color: '#f39c12' },
        { id: 'enzim', name: 'Enzim & Katalisis', icon: '⚡', color: '#e67e22' },
        { id: 'siklus-sel', name: 'Siklus Sel & Pembelahan', icon: '🔁', color: '#2ecc71' },
        { id: 'metabolisme', name: 'Metabolisme Sel', icon: '🔥', color: '#c0392b' },
        { id: 'sintesis-protein', name: 'Sintesis Protein', icon: '🧬', color: '#8e44ad' },
        { id: 'sel-imun', name: 'Sel Imun', icon: '🛡️', color: '#27ae60' },
        { id: 'sel-tubuh', name: 'Sel Tubuh Lainnya', icon: '🧫', color: '#2980b9' }
      ];

      // ==================== DATA ITEM DENGAN KONTEN DETAIL ====================
      function generateItems() {
        const items = [];

        function add(id, name, category, icon, iconBg, content) {
          items.push({ id, name, category, icon, iconBg, content,
            sketchfabSearch: name.replace(/\s+/g, '+') + '+3d+model' });
        }

        // KATEGORI 1: ORGANEL UTAMA (15 item)
        const oCat = 'organel-utama';

        add('nucleus', 'Inti Sel (Nukleus)', oCat, '⭐', '#9b59b6', `
          <h4>Definisi & Gambaran Umum</h4>
          <p>Inti sel atau nukleus adalah organel terbesar dalam sel eukariotik, berfungsi sebagai pusat kendali yang menyimpan dan melindungi materi genetik berupa DNA. Nukleus pertama kali diamati oleh Antonie van Leeuwenhoek pada tahun 1700-an, namun baru dideskripsikan secara detail oleh Robert Brown pada tahun 1831 saat mengamati sel anggrek. Nama "nukleus" berasal dari bahasa Latin yang berarti "kernel" atau "inti".</p>
          <p>Hampir semua sel eukariotik memiliki nukleus, kecuali beberapa sel khusus seperti eritrosit matang (sel darah merah) yang kehilangan nukleusnya selama proses pematangan untuk memaksimalkan kapasitas pengangkutan oksigen. Sebaliknya, sel otot rangka memiliki banyak nukleus (multinukleat) karena terbentuk dari fusi banyak sel selama perkembangan.</p>
          
          <h4>Struktur Detail</h4>
          <p>Nukleus terdiri dari beberapa komponen struktural yang bekerja bersama:</p>
          <ul>
            <li><strong>Membran Inti (Nuclear Envelope):</strong> Lapisan ganda fosfolipid yang memisahkan isi nukleus dari sitoplasma. Terdiri dari membran luar yang terhubung dengan Retikulum Endoplasma Kasar dan membran dalam yang berikatan dengan lamina inti. Ketebalan total sekitar 30-50 nm.</li>
            <li><strong>Pori Inti (Nuclear Pore Complex):</strong> Kompleks protein raksasa dengan berat molekul sekitar 125 juta Dalton yang membentuk saluran selektif. Setiap pori terdiri dari sekitar 30 protein berbeda yang disebut nukleoporin. Molekul kecil (<40 kDa) dapat berdifusi bebas, sementara molekul besar memerlukan sinyal lokalisasi inti (NLS) dan transport aktif yang dimediasi oleh importin dan exportin. Rata-rata sel mamalia memiliki 3000-4000 pori inti.</li>
            <li><strong>Lamina Inti:</strong> Jaring-jaring protein filamen intermediet (lamin A, B, C) yang melapisi sisi dalam membran inti. Lamina memberikan dukungan mekanis, mempertahankan bentuk nukleus, dan berperan dalam organisasi kromatin. Mutasi pada gen lamin menyebabkan penyakit langka yang disebut laminopati, termasuk sindrom Hutchinson-Gilford progeria (penuaan dini).</li>
            <li><strong>Nukleoplasma:</strong> Cairan kental di dalam nukleus yang mengandung nukleotida, enzim, protein, dan faktor transkripsi. Mirip dengan sitoplasma tetapi memiliki komposisi ion yang berbeda.</li>
            <li><strong>Nukleolus:</strong> Struktur padat tanpa membran di dalam nukleus yang merupakan tempat sintesis RNA ribosom (rRNA) dan perakitan subunit ribosom. Nukleolus terbentuk di sekitar daerah pengorganisasi nukleolus (NOR) pada kromosom akrosentrik (13, 14, 15, 21, 22 pada manusia).</li>
            <li><strong>Kromatin:</strong> Kompleks DNA dan protein histon yang membentuk kromosom. Eukromatin adalah bentuk longgar yang aktif ditranskripsi, sedangkan heterokromatin adalah bentuk padat yang tidak aktif secara transkripsi.</li>
          </ul>
          
          <div class="info-box">
            <strong>Tahukah Kamu?</strong> Jika semua DNA dalam satu sel manusia direntangkan, panjangnya mencapai sekitar 2 meter. DNA ini harus dikemas ke dalam nukleus yang diameternya hanya sekitar 6 mikrometer. Ini setara dengan memasukkan benang sepanjang 40 km ke dalam bola tenis!
          </div>
          
          <h4>Fungsi Utama</h4>
          <ul>
            <li><strong>Penyimpanan Materi Genetik:</strong> Melindungi DNA dari kerusakan oleh enzim dan radikal bebas di sitoplasma.</li>
            <li><strong>Replikasi DNA:</strong> Proses penggandaan DNA terjadi di dalam nukleus sebelum pembelahan sel.</li>
            <li><strong>Transkripsi:</strong> Sintesis mRNA dari template DNA. RNA polimerase II membaca gen dan menghasilkan pre-mRNA yang kemudian diproses (capping, splicing, polyadenylation).</li>
            <li><strong>Regulasi Ekspresi Gen:</strong> Nukleus mengontrol gen mana yang diekspresikan melalui faktor transkripsi, modifikasi histon, dan metilasi DNA.</li>
            <li><strong>Pemrosesan RNA:</strong> Splicing (pembuangan intron), penambahan 5' cap, dan 3' poly-A tail terjadi di nukleus sebelum mRNA diekspor ke sitoplasma.</li>
            <li><strong>Perakitan Ribosom:</strong> Nukleolus mensintesis rRNA dan merakitnya dengan protein ribosom menjadi subunit 40S dan 60S.</li>
          </ul>
          
          <h4>Transport Nukleus-Sitoplasma</h4>
          <p>Pori inti mengatur lalu lintas molekul dengan sangat selektif. Protein yang perlu masuk ke nukleus (seperti faktor transkripsi dan histon) memiliki Nuclear Localization Signal (NLS) yang dikenali oleh importin. Sebaliknya, mRNA, tRNA, dan subunit ribosom yang perlu keluar memiliki Nuclear Export Signal (NES) yang dikenali oleh exportin. Proses ini membutuhkan energi dari GTP yang dihidrolisis oleh protein Ran.</p>
          
          <h4>Gangguan Terkait</h4>
          <ul>
            <li><strong>Kanker:</strong> Banyak kanker menunjukkan abnormalitas bentuk nukleus (pleomorfisme inti) yang digunakan sebagai kriteria diagnostik.</li>
            <li><strong>Progeria:</strong> Mutasi gen LMNA menyebabkan penuaan dini akibat kerusakan lamina inti.</li>
            <li><strong>Sindrom Down:</strong> Disebabkan oleh trisomi kromosom 21, terlihat dari jumlah kromosom abnormal di nukleus.</li>
          </ul>
        `);

        add('mitochondria', 'Mitokondria', oCat, '⚡', '#e74c3c', `
          <h4>Definisi & Gambaran Umum</h4>
          <p>Mitokondria adalah organel bermembran ganda yang berfungsi sebagai pusat pembangkit energi sel eukariotik. Nama "mitokondria" berasal dari bahasa Yunani "mitos" (benang) dan "chondrion" (butiran), menggambarkan bentuknya di bawah mikroskop. Mitokondria sering disebut "the powerhouse of the cell" karena menghasilkan sebagian besar ATP melalui fosforilasi oksidatif.</p>
          <p>Berdasarkan teori endosimbiosis yang diajukan Lynn Margulis pada tahun 1967, mitokondria berasal dari bakteri aerobik purba (kemungkinan dari kelompok Alphaproteobacteria) yang ditelan oleh sel eukariotik awal sekitar 1.5-2 miliar tahun lalu. Bukti teori ini meliputi: DNA sirkuler mirip bakteri, ribosom 70S, membran ganda, dan pembelahan dengan binary fission.</p>
          
          <h4>Struktur Detail</h4>
          <ul>
            <li><strong>Membran Luar:</strong> Halus, mengandung protein porin yang membentuk saluran besar. Permeabel terhadap molekul hingga 5000 Dalton. Mengandung enzim untuk metabolisme lipid.</li>
            <li><strong>Ruang Antar Membran:</strong> Mengandung sitokrom c yang berperan dalam apoptosis. Konsentrasi ion mirip sitosol.</li>
            <li><strong>Membran Dalam:</strong> Sangat impermeabel, terlipat membentuk krista. Rasio protein:lipid 3:1. Mengandung kompleks rantai transpor elektron (I-IV) dan ATP sintase (Kompleks V).</li>
            <li><strong>Krista:</strong> Lipatan yang memperluas permukaan. Sel jantung memiliki krista rapat, sel hati lebih longgar.</li>
            <li><strong>Matriks:</strong> Mengandung enzim siklus Krebs, mtDNA, ribosom mitokondria, tRNA, dan granula kalsium. pH sekitar 7.8.</li>
          </ul>
          
          <div class="info-box">
            <strong>Tahukah Kamu?</strong> Mitokondria menghasilkan panas setara suhu 50°C di dalam krista! Untungnya, sitosol mendinginkannya dengan cepat. Racun sianida mematikan karena menghambat Kompleks IV di rantai transpor elektron, menghentikan produksi ATP dalam hitungan menit.
          </div>
          
          <h4>Fungsi Lengkap</h4>
          <ul>
            <li><strong>Produksi ATP:</strong> 1 glukosa → ~30-32 ATP melalui glikolisis, siklus Krebs, dan rantai transpor elektron.</li>
            <li><strong>Beta-Oksidasi Asam Lemak:</strong> Pemecahan asam lemak menjadi Asetil-KoA.</li>
            <li><strong>Siklus Urea:</strong> Detoksifikasi amonia di hati.</li>
            <li><strong>Homeostasis Kalsium:</strong> Bekerja sama dengan RE mengatur Ca2+ untuk sinyal sel dan kontraksi otot.</li>
            <li><strong>Apoptosis:</strong> Pelepasan sitokrom c mengaktifkan kaskade kaspase.</li>
            <li><strong>Termogenesis:</strong> UCP1 di adiposit coklat menghasilkan panas.</li>
            <li><strong>Sintesis Heme:</strong> Langkah pertama dan terakhir sintesis hemoglobin.</li>
            <li><strong>Sintesis Steroid:</strong> Kolesterol → hormon steroid di adrenal dan gonad.</li>
          </ul>
          
          <h4>DNA Mitokondria (mtDNA)</h4>
          <p>Berukuran 16.569 bp pada manusia, mengandung 37 gen (13 protein, 22 tRNA, 2 rRNA). Diwariskan secara maternal. Tingkat mutasi 10x lebih tinggi dari DNA inti karena tidak memiliki histon pelindung dan sistem perbaikan yang efisien.</p>
          
          <h4>Dinamika Mitokondria</h4>
          <ul>
            <li><strong>Fisi:</strong> Pembelahan oleh protein Drp1.</li>
            <li><strong>Fusi:</strong> Penggabungan oleh Mfn1/Mfn2 dan OPA1.</li>
            <li><strong>Mitofagi:</strong> Autofagi selektif mitokondria rusak melalui jalur PINK1/Parkin.</li>
          </ul>
          
          <h4>Gangguan Terkait</h4>
          <ul>
            <li><strong>Penyakit Mitokondria:</strong> MELAS, MERRF, sindrom Leigh akibat mutasi mtDNA.</li>
            <li><strong>Parkinson:</strong> Mutasi PINK1/Parkin mengganggu mitofagi.</li>
            <li><strong>Penuaan:</strong> Akumulasi mutasi mtDNA berkorelasi dengan penuaan.</li>
            <li><strong>Kanker:</strong> Efek Warburg - sel kanker beralih ke glikolisis meski ada oksigen.</li>
          </ul>
        `);

        add('rough-er', 'Retikulum Endoplasma Kasar', oCat, '🌐', '#f1c40f', `
          <h4>Definisi & Gambaran Umum</h4>
          <p>Retikulum Endoplasma Kasar (Rough ER) adalah jaringan membran yang ditempeli ribosom, membentuk sistem saluran dan kantung pipih (sisterna) yang terhubung dengan membran inti. Nama "retikulum" berasal dari bahasa Latin yang berarti "jaring kecil", sementara "endoplasma" berarti "di dalam sitoplasma". RE Kasar pertama kali diamati oleh Keith Porter dan Albert Claude pada tahun 1945 menggunakan mikroskop elektron.</p>
          <p>RE Kasar sangat berkembang di sel-sel yang aktif mensintesis protein untuk sekresi, seperti sel plasma (menghasilkan antibodi), sel asinar pankreas (menghasilkan enzim pencernaan), dan sel goblet (menghasilkan mukus).</p>
          
          <h4>Struktur Detail</h4>
          <ul>
            <li><strong>Sisterna:</strong> Kantung pipih bertumpuk yang memperluas area permukaan untuk sintesis protein.</li>
            <li><strong>Ribosom Terikat:</strong> Ribosom 80S menempel pada permukaan sitosolik RE melalui protein translokon (Sec61 kompleks).</li>
            <li><strong>Lumen RE:</strong> Ruang di dalam sisterna tempat pelipatan protein terjadi. Mengandung chaperone seperti BiP (Hsp70) dan calnexin.</li>
            <li><strong>Hubungan dengan Membran Inti:</strong> Membran luar inti adalah kelanjutan langsung dari membran RE.</li>
          </ul>
          
          <h4>Fungsi Utama</h4>
          <ul>
            <li><strong>Sintesis Protein Sekretori:</strong> Protein yang akan disekresi, dimasukkan ke membran, atau dikirim ke lisosom disintesis di sini.</li>
            <li><strong>Glikosilasi Awal:</strong> Penambahan oligosakarida ke asparagin (N-linked glycosylation) dimulai di RE.</li>
            <li><strong>Pelipatan Protein:</strong> Chaperone membantu protein melipat dengan benar. Protein yang gagal melipat didegradasi melalui ERAD (ER-Associated Degradation).</li>
            <li><strong>Kontrol Kualitas:</strong> Hanya protein yang terlipat benar yang diizinkan melanjutkan ke Golgi.</li>
            <li><strong>Penyimpanan Kalsium:</strong> RE menyimpan Ca2+ dan melepaskannya saat sinyal (penting untuk kontraksi otot dan sinyal sel).</li>
          </ul>
          
          <div class="info-box">
            <strong>Signal Peptida:</strong> Protein yang ditakdirkan untuk RE memiliki urutan sinyal di N-terminal (15-30 asam amino hidrofobik). Signal Recognition Particle (SRP) mengenali urutan ini dan mengarahkan ribosom ke translokon di membran RE.
          </div>
        `);

        add('smooth-er', 'Retikulum Endoplasma Halus', oCat, '🌐', '#f1c40f', `
          <h4>Definisi & Gambaran Umum</h4>
          <p>Retikulum Endoplasma Halus (Smooth ER) adalah jaringan membran tubular tanpa ribosom, melanjutkan dari RE Kasar. Berbeda dengan RE Kasar yang pipih, RE Halus berbentuk tabung yang saling berhubungan. RE Halus sangat berkembang di sel hati (hepatosit) untuk detoksifikasi, sel otot (retikulum sarkoplasmik) untuk penyimpanan kalsium, dan sel penghasil steroid.</p>
          
          <h4>Fungsi Utama</h4>
          <ul>
            <li><strong>Sintesis Lipid:</strong> Fosfolipid, kolesterol, dan steroid dibuat di sini.</li>
            <li><strong>Detoksifikasi:</strong> Enzim sitokrom P450 di hati memodifikasi obat dan toksin agar lebih mudah diekskresi.</li>
            <li><strong>Metabolisme Karbohidrat:</strong> Glukosa-6-fosfatase di RE hati melepaskan glukosa ke darah.</li>
            <li><strong>Penyimpanan Kalsium:</strong> Retikulum sarkoplasmik di sel otot menyimpan dan melepaskan Ca2+ untuk kontraksi.</li>
          </ul>
          
          <div class="highlight-box">
            <strong>Fakta Menarik:</strong> Konsumsi alkohol kronis menyebabkan proliferasi besar-besaran RE Halus di hati, meningkatkan toleransi terhadap alkohol dan obat-obatan tertentu. Inilah mengapa pecandu alkohol memerlukan dosis anestesi yang lebih tinggi!
          </div>
        `);

        add('ribosome', 'Ribosom', oCat, '●', '#2c3e50', `
          <h4>Definisi</h4>
          <p>Ribosom adalah kompleks ribonukleoprotein yang berfungsi sebagai tempat sintesis protein (translasi). Ditemukan oleh George Palade pada tahun 1950-an. Terdiri dari subunit kecil (40S) dan subunit besar (60S) yang bersama-sama membentuk ribosom 80S pada eukariota. Ribosom membaca kode genetik dari mRNA dan menerjemahkannya menjadi rantai polipeptida dengan bantuan tRNA.</p>
          <p>Setiap sel manusia mengandung jutaan ribosom. Sel yang aktif mensintesis protein seperti sel pankreas dapat memiliki hingga 10 juta ribosom.</p>
          
          <h4>Struktur</h4>
          <ul>
            <li><strong>Subunit 40S:</strong> Mengandung rRNA 18S dan sekitar 33 protein. Tempat pengikatan mRNA dan pembacaan kodon.</li>
            <li><strong>Subunit 60S:</strong> Mengandung rRNA 28S, 5.8S, 5S dan sekitar 49 protein. Memiliki aktivitas peptidil transferase (ribozim).</li>
            <li><strong>Situs A (Aminoacyl):</strong> Tempat masuk tRNA yang membawa asam amino baru.</li>
            <li><strong>Situs P (Peptidyl):</strong> Tempat tRNA yang membawa rantai polipeptida yang sedang tumbuh.</li>
            <li><strong>Situs E (Exit):</strong> Tempat tRNA kosong keluar dari ribosom.</li>
          </ul>
          
          <div class="info-box">
            <strong>Kecepatan Sintesis:</strong> Ribosom eukariotik dapat menambahkan sekitar 2-6 asam amino per detik. Satu molekul mRNA dapat dibaca oleh banyak ribosom sekaligus membentuk polisom (poliribosom).
          </div>
        `);

        add('golgi', 'Badan Golgi', oCat, '📦', '#f39c12', `
          <h4>Definisi</h4>
          <p>Badan Golgi (Golgi apparatus) adalah organel berbentuk tumpukan kantung pipih (sisterna) yang berfungsi memproses, mengemas, dan mendistribusikan protein dan lipid. Ditemukan oleh Camillo Golgi pada tahun 1898 menggunakan pewarnaan perak nitrat. Sering disebut "kantor pos sel" karena perannya dalam menyortir dan mengirim molekul ke tujuan yang tepat.</p>
          
          <h4>Struktur</h4>
          <ul>
            <li><strong>Sisi Cis:</strong> Wajah penerima, menerima vesikel dari RE.</li>
            <li><strong>Sisterna Medial:</strong> Tempat modifikasi terjadi (glikosilasi, fosforilasi, sulfasi).</li>
            <li><strong>Sisi Trans:</strong> Wajah pengirim, melepas vesikel ke membran plasma, lisosom, atau vesikel sekretori.</li>
            <li><strong>Trans-Golgi Network (TGN):</strong> Pusat penyortiran utama.</li>
          </ul>
          
          <h4>Fungsi</h4>
          <ul>
            <li><strong>Modifikasi Protein:</strong> Glikosilasi, sulfasi, fosforilasi.</li>
            <li><strong>Penyortiran:</strong> Menentukan tujuan protein (membran, sekresi, lisosom).</li>
            <li><strong>Sintesis Lisosom:</strong> Membentuk lisosom primer.</li>
            <li><strong>Sintesis Dinding Sel:</strong> Pada tumbuhan, mensintesis pektin dan hemiselulosa.</li>
          </ul>
        `);

        add('lysosome', 'Lisosom', oCat, '🔬', '#27ae60', `
          <h4>Definisi</h4>
          <p>Lisosom adalah organel berbentuk kantung yang mengandung enzim hidrolitik untuk pencernaan intraseluler. Ditemukan oleh Christian de Duve pada tahun 1955 (Nobel 1974). Disebut "kantung bunuh diri sel" karena enzimnya dapat mencerna seluruh sel saat apoptosis.</p>
          
          <h4>Karakteristik</h4>
          <ul>
            <li><strong>pH Asam (~5.0):</strong> Dipertahankan oleh pompa proton V-ATPase. Enzim lisosom optimal pada pH asam.</li>
            <li><strong>50+ Enzim Hidrolitik:</strong> Protease, lipase, nuklease, glikosidase, fosfatase.</li>
            <li><strong>Membran Lisosom:</strong> Sangat terglikosilasi untuk melindungi dari enzim di dalamnya.</li>
          </ul>
          
          <h4>Fungsi</h4>
          <ul>
            <li><strong>Autofagi:</strong> Mendaur ulang organel tua atau rusak.</li>
            <li><strong>Fagositosis:</strong> Mencerna patogen yang ditelan sel imun.</li>
            <li><strong>Endositosis:</strong> Memproses material yang masuk sel.</li>
            <li><strong>Krinafagi:</strong> Mendegradasi butiran sekretori yang tidak dilepaskan.</li>
          </ul>
          
          <div class="highlight-box">
            <strong>Gangguan:</strong> Penyakit Tay-Sachs disebabkan defisiensi enzim lisosom heksosaminidase A, menyebabkan akumulasi ganglioside di otak. Penyakit Gaucher disebabkan defisiensi glukoserebrosidase.
          </div>
        `);

        add('cell-membrane', 'Membran Sel', oCat, '🧪', '#3498db', `
          <h4>Definisi</h4>
          <p>Membran sel (membran plasma) adalah lapisan ganda fosfolipid dengan protein tertanam yang membungkus seluruh sel, memisahkan isi sel dari lingkungan luar. Model strukturnya disebut "fluid mosaic model" yang diajukan oleh Singer dan Nicolson pada tahun 1972.</p>
          
          <h4>Komposisi</h4>
          <ul>
            <li><strong>Fosfolipid (50%):</strong> Kepala hidrofilik, ekor hidrofobik. Membentuk bilayer spontan.</li>

            <li><strong>Protein (30%):</strong> Integral (transmembran) dan perifer. Fungsi: saluran, reseptor, enzim, penanda sel.</li>
            <li><strong>Glikokaliks:</strong> Lapisan gula di permukaan luar untuk pengenalan sel.</li>
          </ul>
          
          <h4>Fungsi</h4>
          <ul>
            <li><strong>Barier Selektif:</strong> Mengatur keluar masuk molekul.</li>
            <li><strong>Komunikasi:</strong> Reseptor menerima sinyal dari luar.</li>
            <li><strong>Adhesi Sel:</strong> Protein CAM menghubungkan sel satu sama lain.</li>
            <li><strong>Potensial Membran:</strong> Perbedaan muatan listrik antara luar dan dalam.</li>
          </ul>
        `);

        add('peroxisome', 'Peroksisom', 'organel-tambahan', '🧴', '#e74c3c', `

        add('centrosome', 'Sentrosom', 'organel-tambahan', '🎯', '#e74c3c', `
          <h4>Definisi</h4>

        add('cytoskeleton', 'Sitoskeleton', 'organel-tambahan', '🏗️', '#7f8c8d', `
          <h4>Definisi</h4>
          <p>Sitoskeleton adalah jaringan serat protein yang memberikan bentuk, dukungan mekanis, dan jalur transportasi di dalam sel. Terdiri dari tiga jenis serat utama dengan ukuran dan fungsi berbeda.</p>

        add('proteasome', 'Proteasom', 'organel-tambahan', '🗑️', '#c0392b', `

      const allItems = generateItems();

      // ==================== STATE ====================
      let currentCategory = 'all';
      let currentPage = 1;
      const itemsPerPage = 20;
      let filteredItems = [...allItems];
      let currentOrganelle = null;

      const sidebar = document.getElementById('sidebar');
      const libraryGrid = document.getElementById('library-grid');
      const pagination = document.getElementById('pagination');
      const searchInput = document.getElementById('search-input');
      const searchBtn = document.getElementById('search-btn');
	  const searchExtInput = document.getElementById('search-ext-input');
	  const searchExtBtn = document.getElementById('search-ext-btn');
	  const externalResults = document.getElementById('external-results');
	  let searchMode = 'internal';
      const itemCount = document.getElementById('item-count');
      const cellyMessage = document.getElementById('celly-message');
      const detailOverlay = document.getElementById('detail-overlay');
      const detailCloseBtn = document.getElementById('detail-close-btn');
      const detailIcon = document.getElementById('detail-icon');
      const detailTitle = document.getElementById('detail-title');
      const detailCategory = document.getElementById('detail-category');
      const detailContent = document.getElementById('detail-content');
      const detailOpen3dBtn = document.getElementById('detail-open-3d');
      const model3dOverlay = document.getElementById('model-3d-overlay');
      const model3dTitle = document.getElementById('model-3d-title');
      const model3dIframe = document.getElementById('model-3d-iframe');
      const model3dCloseBtn = document.getElementById('model-3d-close-btn');
      const model3dFallbackLink = document.getElementById('model-3d-fallback-link');
      const themeToggleBtn = document.getElementById('theme-toggle-btn');
      const backBtn = document.getElementById('back-btn');

      function setTheme(theme) {
        if (theme === 'light') {
          document.body.classList.add('light-theme');
          themeToggleBtn.innerHTML = '☾ Dark';
        } else {
          document.body.classList.remove('light-theme');
          themeToggleBtn.innerHTML = '☀ Light';
        }
        localStorage.setItem('bioverse_theme', theme);
      }
      setTheme(localStorage.getItem('bioverse_theme') || 'dark');
      themeToggleBtn.addEventListener('click', () => {
        setTheme(document.body.classList.contains('light-theme') ? 'dark' : 'light');
      });

      function buildSidebar() {
        const counts = {};
        allItems.forEach(i => counts[i.category] = (counts[i.category] || 0) + 1);
        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'category-btn' + (cat.id === 'all' ? ' active' : '');
          btn.dataset.category = cat.id;
          btn.innerHTML = `${cat.name} <span class="category-count">${cat.id==='all'?allItems.length:counts[cat.id]||0}</span>`;
          btn.addEventListener('click', () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat.id;
            currentPage = 1;
            filterItems();
          });
          sidebar.appendChild(btn);
        });
      }

      function filterItems() {
        let items = [...allItems];
        if (currentCategory !== 'all') items = items.filter(i => i.category === currentCategory);
        const q = searchInput.value.trim().toLowerCase();
        if (q) items = items.filter(i => i.name.toLowerCase().includes(q) || i.content.toLowerCase().includes(q));
        filteredItems = items;
        itemCount.textContent = items.length + ' item';
        renderPage();
      }

      function renderPage() {
        const tp = Math.ceil(filteredItems.length / itemsPerPage);
        const start = (currentPage - 1) * itemsPerPage;
        const pageItems = filteredItems.slice(start, start + itemsPerPage);
        libraryGrid.innerHTML = '';
        pageItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'organelle-card';
          card.innerHTML = `
            <div class="card-icon" style="background:${item.iconBg};color:white;">${item.icon}</div>
            <div class="card-title">${item.name}</div>
            <div class="card-function">${item.content.replace(/<[^>]*>/g,'').substring(0,120)}...</div>
            <div class="card-actions">
              <button class="btn-detail">Baca Detail</button>
              <button class="btn-3d">3D</button>
            </div>`;
          card.addEventListener('click', () => openDetail(item));
          card.querySelector('.btn-detail').addEventListener('click', e => { e.stopPropagation();
            openDetail(item); });
          card.querySelector('.btn-3d').addEventListener('click', e => { e.stopPropagation();
            openModel3D(item); });
          libraryGrid.appendChild(card);
        });
        renderPagination(tp);
      }

      function renderPagination(tp) {
        pagination.innerHTML = '';
        if (tp <= 1) return;
        const prev = document.createElement('button');
        prev.className = 'page-btn';
        prev.textContent = '«';
        prev.disabled = currentPage === 1;
        prev.onclick = () => { currentPage--;
          renderPage();
          window.scrollTo(0, 0); };
        pagination.appendChild(prev);
        for (let i = 1; i <= tp; i++) {
          const b = document.createElement('button');
          b.className = 'page-btn' + (i === currentPage ? ' active' : '');
          b.textContent = i;
          b.onclick = () => { currentPage = i;
            renderPage();
            window.scrollTo(0, 0); };
          pagination.appendChild(b);
        }
        const next = document.createElement('button');
        next.className = 'page-btn';
        next.textContent = '»';
        next.disabled = currentPage === tp;
        next.onclick = () => { currentPage++;
          renderPage();
          window.scrollTo(0, 0); };
        pagination.appendChild(next);
      }

      function openDetail(item) {
        currentOrganelle = item;
        detailIcon.innerHTML = item.icon;
        detailIcon.style.background = item.iconBg;
        detailIcon.style.color = 'white';
        detailTitle.textContent = item.name;
        const catObj = categories.find(c => c.id === item.category);
        detailCategory.textContent = catObj ? catObj.name : item.category;
        detailContent.innerHTML = item.content;
        detailOverlay.classList.add('active');
        cellyMessage.innerHTML = `<span>Celly:</span> Membaca tentang <strong>${item.name}</strong>. Klik "3D" untuk model interaktif!`;
      }

      detailCloseBtn.addEventListener('click', () => detailOverlay.classList.remove('active'));
      detailOverlay.addEventListener('click', e => { if (e.target === detailOverlay) detailOverlay.classList.remove(
        'active'); });
      detailOpen3dBtn.addEventListener('click', () => { if (currentOrganelle) openModel3D(currentOrganelle); });

      function openModel3D(item) {
        model3dTitle.textContent = 'Model 3D: ' + item.name;
        const url = 'https://sketchfab.com/search?q=' + encodeURIComponent(item.sketchfabSearch) + '&type=models';
        model3dIframe.src = url;
        model3dFallbackLink.href = url;
        model3dOverlay.classList.add('active');
      }
      model3dCloseBtn.addEventListener('click', () => { model3dOverlay.classList.remove('active');
        model3dIframe.src = ''; });
      model3dOverlay.addEventListener('click', e => { if (e.target === model3dOverlay) { model3dOverlay.classList
            .remove('active');
          model3dIframe.src = ''; } });

      function performSearch() { currentPage = 1;
        externalResults.classList.remove('active');
		filterItems(); }
      searchBtn.addEventListener('click', performSearch);
      searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') performSearch(); });
      backBtn.addEventListener('click', () => { window.location.href = 'index.html'; });

      buildSidebar();
      filterItems();

// SEARCH EKSTERNAL (Wikipedia API)
async function performExternalSearch() {
  const q = searchExtInput.value.trim();
  if (!q) return;
  
  externalResults.innerHTML = '<p class="external-loading">🔍 Mencari di Wikipedia...</p>';
  externalResults.classList.add('active');
  cellyMessage.innerHTML = `<span>Celly:</span> Mencari info tentang "<em>${q}</em>" dari Wikipedia...`;
  
  try {
    const resp = await fetch(`https://id.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*`);
    const data = await resp.json();
    
    if (data.query.search.length === 0) {
      externalResults.innerHTML = '<p style="text-align:center;color:var(--text-secondary);">Tidak ditemukan hasil. Coba kata kunci lain.</p>';
      cellyMessage.innerHTML = `<span>Celly:</span> Maaf, tidak ada hasil untuk "<em>${q}</em>". Coba kata kunci lain ya.`;
      return;
    }
    
    let html = '';
    for (let i = 0; i < Math.min(data.query.search.length, 5); i++) {
      const r = data.query.search[i];
      html += `
        <div class="external-result-item">
          <h5>📖 ${r.title}</h5>
          <p>${r.snippet.replace(/<\/?[^>]+(>|$)/g, '').substring(0, 300)}...</p>
          <a href="https://id.wikipedia.org/wiki/${encodeURIComponent(r.title)}" target="_blank" rel="noopener">Baca selengkapnya di Wikipedia →</a>
        </div>`;
    }
    externalResults.innerHTML = html;
    cellyMessage.innerHTML = `<span>Celly:</span> Aku menemukan ${Math.min(data.query.search.length, 5)} hasil dari Wikipedia untuk "<em>${q}</em>". Klik link untuk membaca lengkapnya!`;
  } catch (e) {
    externalResults.innerHTML = '<p style="text-align:center;color:#e74c3c;">Gagal menghubungi Wikipedia. Periksa koneksi internetmu.</p>';
    cellyMessage.innerHTML = `<span>Celly:</span> Ups, gagal mencari. Pastikan kamu terhubung ke internet ya.`;
  }
}

// Event listener search external
searchExtBtn.addEventListener('click', performExternalSearch);
searchExtInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') performExternalSearch();
});

// TAB SWITCHING
document.querySelectorAll('.search-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    searchMode = tab.dataset.tab;
    
    document.getElementById('search-internal').style.display = searchMode === 'internal' ? 'flex' : 'none';
    document.getElementById('search-external').style.display = searchMode === 'external' ? 'flex' : 'none';
    
    if (searchMode === 'internal') {
      externalResults.classList.remove('active');
      cellyMessage.innerHTML = '<span>Celly:</span> Mode pencarian internal. Cari di 100 item MicroVerse 1.';
    } else {
      cellyMessage.innerHTML = '<span>Celly:</span> Mode pencarian web. Aku akan mencari di Wikipedia untukmu!';
    }
  });
});

        '<span>Celly:</span> Makrofag, Neutrofil, dan sel imun favoritmu ada di sini dengan penjelasan lengkap!',
